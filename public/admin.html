<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOKU Admin</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#111;color:#eee}
input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#eee}
button{cursor:pointer}.row{display:flex;gap:8px;margin-bottom:10px}.row input{flex:1;min-width:0}
.c{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:10px;word-break:break-all}
.k{font-weight:700;font-size:17px}.m{color:#aaa;font-size:13px;margin:4px 0}
.b{background:#7a1f1f}.g{background:#1f6b2f}.y{background:#6b5a1f}
.tag{padding:2px 8px;border-radius:6px;font-size:12px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.st div{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:10px;font-size:13px;color:#aaa}.st b{display:block;font-size:22px;color:#eee}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.f button{padding:8px 12px;font-size:14px}
</style></head><body>
<h3>GOKU License Admin</h3>
<div class="row"><input id="pw" type="password" placeholder="Admin password"><button onclick="save()">OK</button></div>
<div class="row"><input id="q" placeholder="key / device / note खोजो (ख़ाली = हाल में चालू हुईं)"><button onclick="go()">खोजो</button></div>
<div class="st" id="st"></div>
<div class="f"><button onclick="flt('')">चालू हुईं</button><button onclick="flt('unused')">Unused</button><button onclick="flt('ultra')">Ultra</button><button onclick="flt('blocked')">Blocked</button></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id);
$('pw').value=sessionStorage.getItem('pw')||'';
function save(){sessionStorage.setItem('pw',$('pw').value);go()}
async function call(o){
  const r=await fetch('/api?op=admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':$('pw').value},body:JSON.stringify(o)});
  return r.json();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
var FLT='';
function flt(f){FLT=f;$('q').value='';go()}
async function stats(){
  const s=await call({action:'stats'});
  if(!s.ok){$('st').innerHTML='';return}
  $('st').innerHTML=`<div><b>${s.total}</b>कुल keys</div><div><b>${s.used}</b>चालू हुईं (फ़ोन पर)</div><div><b>${s.unused}</b>अभी बिना इस्तेमाल</div><div><b>${s.blocked}</b>Blocked</div><div><b>${s.ultraUsed} / ${s.ultra}</b>Ultra चालू / कुल</div>`;
}
async function go(){
  stats();
  const j=await call({action:'search',q:$('q').value,filter:FLT});
  if(!j.ok){$('out').textContent=j.msg||'error';return}
  $('out').innerHTML=j.rows.map(r=>{
    const blocked=r.status!=='active';
    return `<div class="c"><div class="k">${esc(r.key)}</div>
    <div class="m">${esc(r.type)} · <span class="tag ${blocked?'b':'g'}">${esc(r.status)}</span>${blocked&&r.block_reason?' · '+esc(r.block_reason):''}</div>
    <div class="m">Device: ${esc(r.device_id||'—')}</div>
    <div class="m">Activated: ${esc(r.activated_at||'—')} · Expires: ${esc(r.expires_at||(r.days==0?'Lifetime':'—'))}</div>
    <div class="m">Note: ${esc(r.note||'')}</div>
    <div class="row">
      <button class="${blocked?'g':'b'}" onclick="act('${blocked?'unblock':'block'}','${esc(r.key)}')">${blocked?'Unblock':'Block'}</button>
      <button class="y" onclick="act('reset','${esc(r.key)}')">Reset device</button>
      <button onclick="note('${esc(r.key)}')">Note</button></div></div>`}).join('')||'कुछ नहीं मिला';
}
async function act(a,k){
  const o={action:a,key:k};
  if(a==='block'){const r=prompt('Block reason (user की स्क्रीन पर यही दिखेगा):','scammer');if(r===null)return;o.reason=r}
  else if(!confirm(a+' ?\n'+k))return;
  const j=await call(o);if(!j.ok)alert(j.msg);go()}
async function note(k){const n=prompt('Note (नाम/नंबर):');if(n===null)return;await call({action:'note',key:k,note:n});go()}
if($('pw').value)go();
</script></body></html>
